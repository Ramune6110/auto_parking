<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="310" version="1.1" viewBox="0 0 940 310" width="940" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#ffffff" height="310" width="940" x="0" y="0" /><text fill="#263445" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="22" font-weight="bold" x="36" y="43">線形化基準は「計算の基準」、目標軌道は「評価の基準」</text><circle cx="150" cy="189" fill="#263445" r="12" stroke="#ffffff" stroke-width="2" /><text fill="#263445" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="150" y="162">実状態 x</text><circle cx="470" cy="125" fill="#e47737" r="12" stroke="#ffffff" stroke-width="2" /><text fill="#e47737" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="470" y="98">基準 x̄</text><circle cx="790" cy="188" fill="#0c9574" r="12" stroke="#ffffff" stroke-width="2" /><text fill="#0c9574" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="790" y="161">目標 x_ref</text><line stroke="#e47737" stroke-linecap="round" stroke-width="3" x1="155" x2="461" y1="198" y2="140" /><polygon fill="#e47737" points="461,140 451.8787298248581,147.79759131989275 449.6579525490585,136.08107672688124" /><line stroke="#0c9574" stroke-linecap="round" stroke-width="3" x1="481" x2="780" y1="140" y2="196" /><polygon fill="#0c9574" points="780,196 768.6665003567025,199.9435752605186 770.8617969200989,188.2222596809559" /><text fill="#e47737" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="310" y="217">δx = x − x̄</text><text fill="#0c9574" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" x="635" y="209">a = x̄ − x_ref</text><text fill="#263445" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" x="475" y="275">追従偏差 e = δx + a</text></svg>