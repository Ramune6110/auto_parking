<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="350" version="1.1" viewBox="0 0 940 350" width="940" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#ffffff" height="350" width="940" x="0" y="0" /><text fill="#263445" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="21" font-weight="bold" x="38" y="42">モデル整合性：同じ状態・入力から次の目標状態へ進めるか</text><rect fill="#f5f8fa" height="243" rx="16" stroke="#d8e1e7" width="414" x="32" y="67" /><text fill="#0c9574" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="18" font-weight="bold" x="56" y="105">モデル整合：d_k = 0</text><circle cx="92" cy="230" fill="#263445" r="10" stroke="#ffffff" stroke-width="2" /><text fill="#263445" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="16" font-weight="normal" x="66" y="260">x_ref(k)</text><line stroke="#0c9574" stroke-linecap="round" stroke-width="4" x1="102" x2="354" y1="225" y2="142" /><polygon fill="#0c9574" points="354,142 345.97415072082936,150.92108420249667 342.2435717855598,139.59450719420846" /><circle cx="362" cy="138" fill="#0c9574" r="9" stroke="#ffffff" stroke-width="2" /><text fill="#263445" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="14" font-weight="normal" x="99" y="194">f(x_ref,u_ref) = x_ref_next</text><rect fill="#f5f8fa" height="243" rx="16" stroke="#d8e1e7" width="414" x="490" y="67" /><text fill="#e47737" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="18" font-weight="bold" x="514" y="105">モデル不整合：d_k ≠ 0</text><circle cx="550" cy="230" fill="#263445" r="10" stroke="#ffffff" stroke-width="2" /><text fill="#263445" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="16" font-weight="normal" x="524" y="260">x_ref(k)</text><line stroke="#e47737" stroke-linecap="round" stroke-width="3.5" x1="560" x2="782" y1="225" y2="148" /><polygon fill="#e47737" points="782,148 774.1150877653654,157.04589183287692 770.2072823444663,145.77923204794723" /><circle cx="784" cy="146" fill="#e47737" r="8" stroke="#ffffff" stroke-width="2" /><circle cx="842" cy="117" fill="#0c9574" r="9" stroke="#ffffff" stroke-width="2" /><line stroke="#bb3f55" stroke-linecap="round" stroke-width="3" x1="832" x2="794" y1="122" y2="142" /><polygon fill="#bb3f55" points="794,142 800.4383462489988,131.8734162928457 805.9924298909052,142.42617521246794" /><text fill="#bb3f55" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="16" font-weight="normal" x="647" y="210">d_k = 予測 − 目標</text><text fill="#e47737" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="14" font-weight="normal" x="608" y="280">f(x_ref(k),u_ref(k))</text><text fill="#0c9574" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="14" font-weight="normal" x="808" y="101">x_ref(k+1)</text></svg>