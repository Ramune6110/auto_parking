<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="300" version="1.1" viewBox="0 0 940 300" width="940" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#ffffff" height="300" width="940" x="0" y="0" /><text fill="#263445" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="22" font-weight="bold" x="40" y="41">短い有限ホライズンと終端価値関数 P∞ の役割</text><rect fill="#edf8f4" height="134" rx="12" stroke="#0c9574" stroke-width="1.3" width="574" x="41" y="83" /><rect fill="#f5f8fa" height="134" rx="12" stroke="#7c8793" stroke-dasharray="7 5" width="286" x="615" y="83" /><text fill="#0c9574" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="18" font-weight="bold" x="75" y="117">有限ホライズン（LTVでもよい）</text><text fill="#263445" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="19" font-weight="normal" x="75" y="161">A0,B0 … An-1,Bn-1</text><text fill="#7c8793" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="18" font-weight="bold" x="636" y="117">終端以降（LTI近似）</text><text fill="#263445" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="16" font-weight="normal" x="636" y="161">A_f,B_f を一定と仮定</text><line stroke="#3477bc" stroke-linecap="round" stroke-width="2" x1="615" x2="615" y1="225" y2="263" /><text fill="#3477bc" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="17" font-weight="bold" text-anchor="middle" x="615" y="283">P_N = P∞（終端重み）</text></svg>