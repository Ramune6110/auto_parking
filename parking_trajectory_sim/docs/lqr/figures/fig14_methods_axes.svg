<?xml version="1.0" encoding="utf-8" ?>
<svg baseProfile="full" height="330" version="1.1" viewBox="0 0 940 330" width="940" xmlns="http://www.w3.org/2000/svg" xmlns:ev="http://www.w3.org/2001/xml-events" xmlns:xlink="http://www.w3.org/1999/xlink"><defs /><rect fill="#ffffff" height="330" width="940" x="0" y="0" /><text fill="#263445" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="21" font-weight="bold" x="34" y="40">3方式の違いは「線形化位置」と「線形化を更新する回数」</text><rect fill="#f5f8fa" height="174" rx="13" stroke="#d8e1e7" width="240" x="115" y="90" /><text fill="#0c9574" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="235" y="126">① 目標軌道</text><text fill="#263445" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="235" y="171">目標で固定</text><text fill="#263445" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="235" y="219">リカッチ1回</text><circle cx="235" cy="244" fill="#0c9574" r="7" stroke="#ffffff" stroke-width="2" /><rect fill="#f5f8fa" height="174" rx="13" stroke="#d8e1e7" width="240" x="390" y="90" /><text fill="#e47737" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="510" y="126">② 予測基準</text><text fill="#263445" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="510" y="171">予測で固定</text><text fill="#263445" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="510" y="219">リカッチ1回</text><circle cx="510" cy="244" fill="#e47737" r="7" stroke="#ffffff" stroke-width="2" /><rect fill="#f5f8fa" height="174" rx="13" stroke="#d8e1e7" width="240" x="665" y="90" /><text fill="#3477bc" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" x="785" y="126">③ iLQR</text><text fill="#263445" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="785" y="171">予測を更新</text><text fill="#263445" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="17" font-weight="normal" text-anchor="middle" x="785" y="219">リカッチを反復</text><circle cx="767" cy="244" fill="#3477bc" r="6" stroke="#ffffff" stroke-width="2" /><circle cx="785" cy="244" fill="#3477bc" r="6" stroke="#ffffff" stroke-width="2" /><circle cx="803" cy="244" fill="#3477bc" r="6" stroke="#ffffff" stroke-width="2" /><text fill="#7c8793" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="15" font-weight="normal" x="45" y="302">線形化点の置き方と反復回数は異なる設計軸。iLQRの初期軌道には目標も利用できる。</text></svg>