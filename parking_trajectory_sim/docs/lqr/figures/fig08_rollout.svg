nd" stroke-width="3" x1="479" x2="635" y1="155" y2="155" /><polygon fill="#e47737" points="635,155 624.5861698438682,160.96256165412484 624.5861698438682,149.03743834587516" /><text fill="#e47737" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" x="554" y="137">ū2</text><circle cx="650" cy="155" fill="#e47737" r="10" stroke="#ffffff" stroke-width="2" /><text fill="#263445" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" x="650" y="190">x̄3</text><line stroke="#e47737" stroke-linecap="round" stroke-width="3" x1="664" x2="820" y1="155" y2="155" /><polygon fill="#e47737" points="820,155 809.5861698438682,160.96256165412484 809.5861698438682,149.03743834587516" /><text fill="#e47737" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="16" font-weight="bold" text-anchor="middle" x="739" y="137">ū3</text><circle cx="835" cy="155" fill="#e47737" r="10" stroke="#ffffff" stroke-width="2" /><text fill="#263445" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" x="835" y="190">x̄4</text><text fill="#263445" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="17" font-weight="normal" x="48" y="239">x̄0 = 実測・推定状態</text><text fill="#e47737" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="18" font-weight="bold" x="510" y="239">xbar(k+1) = f(xbar(k),ubar(k))</text><text fill="#7c8793" font-family="Noto Sans CJK JP, Yu Gothic, Meiryo, sans-serif" font-size="14" font-weight="normal" x="48" y="274">※ 各区間の外部パラメータ・車速等もモデルに入力する</text></svg>